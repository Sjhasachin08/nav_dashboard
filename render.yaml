services:
  - type: web
    name: nav-dashboard-new
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DISABLE_NAV_LEDGER
        value: "true"
      - key: DISABLE_AUTO_SYNC
        value: "true"